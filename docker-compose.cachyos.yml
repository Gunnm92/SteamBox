services:
  arcadebox-cachyos:
    build:
      context: ..
      dockerfile: ArcadeBox/Dockerfile.cachyos
    image: arcadebox-cachyos:latest
    container_name: arcadebox-cachyos
    hostname: ArcadeBox-CachyOS
    runtime: nvidia
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Paris
      - NVIDIA_VISIBLE_DEVICES=GPU-993ff90a-304b-da13-1287-c533c1073ab4
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Dossier SÉPARÉ de l'appdata ArcadeBox actuel — structure de fichiers
      # incompatible (utilisateur arcade vs abc, pas de .XDG, chemins Steam/
      # Sunshine différents). Ne jamais pointer vers /mnt/user/appdata/arcadebox.
      - ./config-cachyos:/config
      - ./userdata:/userdata               # ROMs, BIOS, saves — layout Batocera partagé, lecture seule prudente au départ
    network_mode: host                     # requis pour seatd/udev et la découverte LAN Sunshine
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid                # requis par libvirtualhid (Sunshine) pour l'émulation
                                            # complète des manettes (vibrations/force-feedback) —
                                            # /dev/uinput seul ne suffit pas, cf. gamepad_profiles
                                            # dans virtualhid_input.cpp (LizardByte/Sunshine)
    device_cgroup_rules:
      - 'c 13:* rmw'                       # /dev/input/*
      - 'c 226:* rmw'                      # /dev/dri/*
    # GID hôte propriétaire de /dev/uinput et /dev/input/* — présent sur le
    # compose prod (docker-compose.yml) mais jamais porté ici (audit
    # 2026-08-26), voir commentaire équivalent dans docker-compose.ubuntu.yml.
    group_add:
      - "71"
    ipc: host                              # parité avec l'IpcMode host de la prod (audit 2026-08-26)
    cap_add:
      - SYS_NICE                           # priorité temps réel audio/vidéo (sunshine, pipewire)
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    shm_size: "2gb"
    restart: unless-stopped
