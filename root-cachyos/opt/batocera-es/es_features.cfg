<?xml version="1.0" encoding="UTF-8"?>
<!--
  Options avancées d'EmulationStation (18/11), à la manière de Batocera :
  « Réglages des jeux > Configuration avancée par système » et « Options
  avancées du jeu ». ES les enregistre dans ~/.emulationstation/batocera.conf
  (<système>.mako=1, <système>["jeu.ext"].mako=1) ; game-launch.sh les lit
  (jeu > système > global).

  Rattachées à l'émulateur unique « steambox » que es-systems-gen.sh déclare
  pour chaque système : un build non-Batocera n'affiche une option que pour
  les émulateurs déclarés dans es_systems.cfg. Ce fichier remplace la liste
  d'options intégrée : seules celles déclarées ici apparaissent.
  ~/.emulationstation/es_features.cfg, s'il existe, est lu À LA PLACE de
  celui-ci.
-->
<features>
  <emulator name="steambox">
    <features>
      <feature name="Génération d'images (MAKO)" value="mako" preset="switchauto"
               description="Lance le jeu par mako-launch. Réglages (multiplicateur, mode) : profil de mako-ui qui vise l'émulateur (Processus associés) ; émulateur en rendu Vulkan." />
      <feature name="Profil MAKO" value="mako_profile" preset="input"
               description="Nom exact d'un profil de mako-ui à imposer. Vide : profil associé à l'émulateur." />
    </features>
  </emulator>
</features>
