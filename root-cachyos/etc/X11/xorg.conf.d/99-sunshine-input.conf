# Les périphériques virtuels créés par Sunshine (souris/clavier/tablette/
# tactile "* passthrough") échouent avec le pilote par défaut 'libinput' :
# "Failed to create a device for /dev/input/eventN". Cause confirmée en
# direct : libinput interroge la base udev on-disk (/run/udev/data/) pour
# initialiser un périphérique, mais udevd calcule et diffuse bien les tags
# (ID_INPUT_MOUSE etc., confirmé via `udevadm monitor`) sans jamais les
# persister dans cette base (`/run/udev/data/` reste vide en permanence,
# cause exacte non élucidée — ni le contenu de règle udev ni le mode
# daemon/non-daemon de systemd-udevd n'y changent rien).
#
# 'evdev', le pilote X11 historique, ouvre le device node directement par
# ioctl sans dépendre d'udev — confirmé en direct : les mêmes devices
# s'initialisent immédiatement avec ce pilote (XINPUT: Adding extended
# input device "Mouse passthrough" (type: MOUSE, id N), sans erreur).
Section "InputClass"
    Identifier "SunshineVirtualInput"
    MatchProduct "passthrough"
    Driver "evdev"
    Option "AutoServerLayout" "true"
EndSection
