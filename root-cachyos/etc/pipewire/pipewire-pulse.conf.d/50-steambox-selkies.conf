# Sortie son du bureau navigateur (25/11) : puits virtuel « selkies », dont
# Selkies capture le moniteur (SELKIES_AUDIO_DEVICE_NAME=selkies.monitor,
# svc-selkies). Créé à chaque (re)démarrage de pipewire-pulse, il est la
# sortie par défaut hors session Moonlight (aucune carte son sinon). Sunshine
# met son propre puits par défaut à la connexion et rend celui-ci à la
# déconnexion : le son de Moonlight n'est pas détourné.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=selkies sink_properties=device.description=Navigateur-Selkies" flags = [ ] }
]
