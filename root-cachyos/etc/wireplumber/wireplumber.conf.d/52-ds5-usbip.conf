# DualSense USB émulée par ds5-usbip (22/11) : haptiques HD.
#
# 1. Volume initial à 100 %. La carte son de la DualSense porte ses
#    haptiques sur les canaux 3-4 ; à 40 % (défaut de WirePlumber pour une
#    nouvelle sortie), PipeWire les atténuait de 24 dB et on ne les sentait
#    plus. Une vraie DualSense n'applique ce volume qu'à son haut-parleur.
#    Ne joue qu'à la première apparition : ensuite, WirePlumber restaure le
#    volume mémorisé (/config/.local/state/wireplumber).
# 2. Jamais sortie par défaut : priorité minimale, pour que le son du jeu
#    reste sur la sortie de Sunshine.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sony_Interactive_Entertainment_DualSense_Wireless_Controller.*" }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 1.0
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Sony_Interactive_Entertainment_DualSense_Wireless_Controller.*" }
    ]
    actions = {
      update-props = {
        priority.session = 0
        priority.driver  = 0
      }
    }
  }
]
