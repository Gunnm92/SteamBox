services:
  arcadebox-ubuntu:
    build:
      context: ..
      dockerfile: ArcadeBox/Dockerfile.ubuntu
    image: arcadebox-ubuntu:latest
    container_name: arcadebox-ubuntu
    hostname: ArcadeBox-Ubuntu
    runtime: nvidia
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Paris
      - NVIDIA_VISIBLE_DEVICES=GPU-993ff90a-304b-da13-1287-c533c1073ab4
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Dossier SÉPARÉ de arcadebox et arcadebox-cachyos — conteneur de test
      # jetable, ne jamais pointer vers un appdata de prod existant.
      - ./config-ubuntu:/config
      - ./userdata:/userdata               # ROMs, BIOS, saves — layout Batocera partagé
    # Bridge + ports mappés (PAS network_mode: host) tant que ArcadeBox (prod,
    # host networking) tourne en parallèle — jamais l'arrêter pour ce test.
    # Sunshine (découverte LAN mDNS) ne fonctionnera pas correctement ainsi,
    # sans conséquence pour valider juste le freeze Heroic/Proton via VNC.
    # Un seul port noVNC (websockify sert désormais les fichiers ET le pont
    # websocket ensemble depuis la fusion svc-websockify/svc-novnc-web —
    # audit 2026-08-26, voir root-cachyos/etc/s6-overlay/.../svc-websockify/run).
    ports:
      - "16080:6080"   # noVNC (fichiers + websocket)
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid                # requis par libvirtualhid (Sunshine)
    device_cgroup_rules:
      - 'c 13:* rmw'                       # /dev/input/*
      - 'c 226:* rmw'                      # /dev/dri/*
    # GID hôte propriétaire de /dev/uinput et /dev/input/* — présent sur le
    # compose prod (docker-compose.yml) mais jamais porté ici (audit
    # 2026-08-26) : sans lui, seul le chmod 666 one-shot d'init-system/run
    # couvre l'accès, et rien ne couvre le hotplug (manette branchée après
    # coup, périphériques virtuels créés par Sunshine à la connexion).
    group_add:
      - "71"
    # Aligné sur l'IpcMode host de la prod (audit 2026-08-26) : les tests SHM
    # menés sur ce compose sans ipc: host ne reproduisaient pas forcément les
    # mêmes conditions que le "BadAccess" MIT-SHM documenté sur x11vnc (voir
    # svc-x11vnc/run) — à retester -noshm avec cette parité avant de le retirer.
    ipc: host
    cap_add:
      - SYS_NICE                           # priorité temps réel audio/vidéo (sunshine, pipewire)
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    shm_size: "2gb"
    restart: "no"                          # conteneur de test — pas de redémarrage auto
