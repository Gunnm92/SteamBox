services:
  arcadebox:
    build:
      context: ..                        # dossier parent = workspace/
      dockerfile: ArcadeBox/Dockerfile
    image: arcadebox:latest
    container_name: arcadebox
    hostname: ArcadeBox
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - TITLE=ArcadeBox
      - RESOLUTION=1920x1080x60         # WxHxRefreshRate
      - DISPLAY_CDEPTH=24
      # Réseau host : 3000/3001 sont pris par d'autres conteneurs (code-server, NPM)
      # donc on décale les ports internes de Selkies via ces variables dédiées.
      - CUSTOM_PORT=3010
      - CUSTOM_HTTPS_PORT=3011
      - CUSTOM_WS_PORT=8083          # 8082 déjà pris par le conteneur open-webui (host mode)
      # Audio Selkies
      - SELKIES_AUDIO_ENABLED=true
      - SELKIES_AUDIO_DEVICE_NAME=output.monitor
      # Mode Wayland (labwc + Xwayland sur :0) — SEUL mode fonctionnel de l'image de
      # base actuelle. PIXELFLUX_WAYLAND=false ne marche PAS : /defaults/startwm.sh
      # (script X11 de linuxserver/webstation) est un stub qui affiche juste "Your
      # platform is not supported" et dort indéfiniment — aucun serveur X ni WM ne
      # démarre. Le README du projet le confirme : "This image only runs in Wayland
      # mode". Ne pas repasser en X11 tant que ce n'est pas réimplémenté en amont.
      - PIXELFLUX_WAYLAND=true
      # Rendu ET encodage sur la même GPU (3090). Un split Intel(rendu)/NVIDIA(encode)
      # segfaultait avant (mauvais noeud auto-détecté), et une fois corrigé, Sunshine/
      # Steam Remote Play échouaient quand même : import cross-GPU du framebuffer
      # impossible (tiling propriétaire par vendeur, non supporté — confirmé par un
      # dev Moonlight/Sunshine, cf. github.com/LizardByte/Sunshine/issues/2140).
      # L'iGPU Intel reste inutilisé par ArcadeBox.
      - DRINODE=/dev/dri/renderD128    # rendu EGL/3D — RTX 3090
      - DRI_NODE=/dev/dri/renderD128   # encodage VAAPI/NVENC — RTX 3090
    volumes:
      - ./config:/config                 # configs + home utilisateur
      - ./userdata:/userdata               # ROMs, BIOS, saves (Batocera layout)
      - /run/udev:/run/udev:ro           # base udev de l'hôte — tags ID_INPUT_* nécessaires
                                          # à libinput (labwc) pour classifier les devices
    network_mode: host                   # requis pour la découverte LAN Steam Link/Sunshine
    devices:
      - /dev/dri:/dev/dri                # GPU (Intel / AMD)
      - /dev/fuse:/dev/fuse              # FUSE pour wsquashfs-launcher
      - /dev/uinput:/dev/uinput          # Steam Link — création manettes virtuelles
    device_cgroup_rules:
      - 'c 13:* rmw'                     # Accès à tout /dev/input/* (major 13 = input)
    group_add:
      - "71"                              # GID hôte propriétaire de /dev/uinput et
                                           # /dev/input/* (crw-rw---- root:71) — sans ça
                                           # l'utilisateur abc n'a pas le droit Unix
                                           # d'ouvrir ces devices malgré device_cgroup_rules
    cap_add:
      - SYS_ADMIN                        # nécessaire pour fuse-overlayfs
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    shm_size: "1gb"
    restart: unless-stopped
